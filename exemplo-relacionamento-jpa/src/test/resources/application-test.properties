# Perfil exclusivo para testes de integração.
# Usa um banco H2 separado do principal (mem:teste) para não interferir.
spring.datasource.url=jdbc:h2:mem:testdb

spring.h2.console.enabled=false
spring.jpa.show-sql=false

# Garante que o Hibernate crie as tabelas ANTES de o data-test.sql ser executado.
spring.jpa.defer-datasource-initialization=true

# Aponta para o data.sql exclusivo dos testes (em vez do src/main/resources/data.sql).
spring.sql.init.data-locations=classpath:data-test.sql

# Serializa LocalDate como string ISO ("1982-11-30") em vez de array ([1982,11,30]).
spring.jackson.serialization.write-dates-as-timestamps=false
